<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F27055">
  <title>Offline · HappiNotes Admin</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 32px; background: #090b10; color: #f4f4f5; font: 16px/1.6 Arial, sans-serif; color-scheme: dark; }
    main { width: min(100%, 380px); text-align: center; }
    svg { width: 64px; height: 64px; color: #f27055; }
    .brand { color: #f27055; font-size: 12px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
    h1 { font-size: 28px; line-height: 1.2; }
    .description { color: #9da4b4; }
    button { margin-top: 16px; padding: 12px 24px; border: 0; border-radius: 12px; background: #f27055; color: #090b10; font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 3px solid #ffad99; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4" /></svg>
    <p class="brand">HappiNotes Studio</p>
    <h1>You’re offline</h1>
    <p class="description">Reconnect to the internet to sign in and manage your content.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
